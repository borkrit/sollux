<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVG Lampa – Włączanie plафона</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .svg-lamp {
      cursor: pointer;
      user-select: none;
    }

    .svg-lamp > img {
      display: block;
      width: 100%;
      height: auto;
    }

    .svg-lamp > svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .svg-lamp svg path:not([d^="M297.047 777.52"]) {
      display: none;
    }

    .svg-lamp path[d^="M297.047 777.52"] {
      opacity: 0;
      transition: opacity 250ms cubic-bezier(0.4, 0, 0.2, 1),
                  fill 250ms cubic-bezier(0.4, 0, 0.2, 1),
                  filter 250ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .svg-lamp.is-lit path[d^="M297.047 777.52"] {
      opacity: 1;
      fill: url(#plafonCore);
      filter: drop-shadow(0 0 12px rgba(255, 206, 105, 0.95))
              drop-shadow(0 0 28px rgba(255, 168, 54, 0.7));
    }
  </style>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("[data-svg-lamp]").forEach((lamp) => {
        lamp.addEventListener("click", () => {
          const isLit = lamp.classList.toggle("is-lit");
          lamp.setAttribute("aria-pressed", String(isLit));
          lamp.setAttribute(
            "aria-label",
            isLit ? "Wyłącz lampę" : "Włącz lampę"
          );
        });
      });
    });
  </script>
